<!--
  ds-avatar — imagen o iniciales + status online.
  Requiere: ../styles/variables.css + avatar.css
  El nombre va en el alt (imagen) o en .visually-hidden (iniciales); el estado,
  como texto .visually-hidden localizable. El punto de color es aria-hidden.
-->

<span class="ds-avatar ds-avatar--md">
  <img
    class="ds-avatar__image"
    src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&h=80&fit=crop&crop=faces"
    alt="Ana Ruiz"
    width="40"
    height="40"
  />
</span>

<span class="ds-avatar ds-avatar--md ds-avatar--with-status">
  <span class="ds-avatar__fallback" aria-hidden="true">LG</span>
  <span class="visually-hidden">Luis Gómez, en línea</span>
  <span class="ds-avatar__status" aria-hidden="true" title="En línea"></span>
</span>

<span class="ds-avatar ds-avatar--sm">
  <span class="ds-avatar__fallback" aria-hidden="true">MS</span>
  <span class="visually-hidden">María Sol</span>
</span>

<span class="ds-avatar ds-avatar--lg ds-avatar--with-status">
  <img
    class="ds-avatar__image"
    src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=96&h=96&fit=crop&crop=faces"
    alt="Carla Díaz"
    width="48"
    height="48"
  />
  <span class="visually-hidden">en línea</span>
  <span class="ds-avatar__status" aria-hidden="true" title="En línea"></span>
</span>
