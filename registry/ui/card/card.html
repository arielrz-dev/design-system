<!--
  ds-card — snippets de marcado accesible.
  Requiere: dist/css/variables.css + card.css
  Opcional: button.css si el footer usa .ds-button
-->

<article class="ds-card" aria-labelledby="card-profile-title">
  <header class="ds-card__header">
    <h2 id="card-profile-title" class="ds-card__title">
      Perfil de equipo
    </h2>
    <p class="ds-card__description" id="card-profile-desc">
      Gestiona el nombre visible y la descripción del workspace.
    </p>
  </header>

  <div
    class="ds-card__body"
    role="group"
    aria-describedby="card-profile-desc"
  >
    <p>
      Los cambios se aplican de inmediato para todos los miembros con acceso
      de edición.
    </p>
    <label for="team-name">
      Nombre del equipo
      <input
        id="team-name"
        name="team-name"
        type="text"
        autocomplete="organization"
        aria-required="true"
      />
    </label>
  </div>

  <footer class="ds-card__footer">
    <button
      type="button"
      class="ds-button ds-button--ghost ds-button--md"
    >
      Descartar
    </button>
    <button
      type="submit"
      class="ds-button ds-button--primary ds-button--md"
      form="team-form"
    >
      Guardar
    </button>
  </footer>
</article>

<!-- Card elevada (p. ej. dentro de un diálogo) -->
<section
  class="ds-card"
  aria-labelledby="card-billing-title"
  style="background-color: var(--rzz-surface-elevated)"
>
  <header class="ds-card__header">
    <h2 id="card-billing-title" class="ds-card__title">
      Facturación
    </h2>
    <p class="ds-card__description">
      Plan actual y próximo cobro.
    </p>
  </header>

  <div class="ds-card__body">
    <p>
      Próximo cobro el <time datetime="2026-10-01">1 de octubre de 2026</time>.
    </p>
  </div>

  <footer class="ds-card__footer">
    <a
      href="/billing"
      class="ds-button ds-button--secondary ds-button--sm"
      role="button"
    >
      Ver detalle
    </a>
  </footer>
</section>
