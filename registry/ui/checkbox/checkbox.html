<!--
  ds-checkbox — snippets de marcado accesible.
  Requiere: ../styles/variables.css + checkbox.css
-->

<!-- Default -->
<label class="ds-checkbox-group" for="terms">
  <input
    id="terms"
    class="ds-checkbox"
    type="checkbox"
    name="terms"
  />
  <span class="ds-checkbox-group__label">Acepto los términos y condiciones</span>
</label>

<!-- Checked -->
<label class="ds-checkbox-group" for="newsletter">
  <input
    id="newsletter"
    class="ds-checkbox"
    type="checkbox"
    name="newsletter"
    checked
  />
  <span class="ds-checkbox-group__label">Suscribirme al boletín</span>
</label>

<!-- Disabled -->
<label class="ds-checkbox-group" for="legacy">
  <input
    id="legacy"
    class="ds-checkbox"
    type="checkbox"
    name="legacy"
    disabled
    aria-disabled="true"
  />
  <span class="ds-checkbox-group__label">Opción no disponible</span>
</label>

<!-- Disabled + checked -->
<label class="ds-checkbox-group" for="locked">
  <input
    id="locked"
    class="ds-checkbox"
    type="checkbox"
    name="locked"
    checked
    disabled
    aria-disabled="true"
  />
  <span class="ds-checkbox-group__label">Preferencia bloqueada</span>
</label>

<!-- Con descripción vía aria-describedby -->
<label class="ds-checkbox-group" for="marketing">
  <input
    id="marketing"
    class="ds-checkbox"
    type="checkbox"
    name="marketing"
    aria-describedby="marketing-hint"
  />
  <span class="ds-checkbox-group__label">Recibir ofertas</span>
</label>
<p id="marketing-hint" class="ds-field__hint">
  Podés darte de baja en cualquier momento.
</p>
