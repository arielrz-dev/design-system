<!--
  ds-table — tabla de órdenes con selección, badges y popover.
  Requiere:
    styles/variables.css
    data-table.css + checkbox.css + badge.css + button.css + popover.css + popover.js
-->

<div class="ds-table-container" role="region" aria-label="Órdenes recientes" tabindex="0">
  <table class="ds-table">
    <thead>
      <tr>
        <th scope="col">
          <span class="ds-table__checkbox">
            <input
              id="orders-select-all"
              class="ds-checkbox"
              type="checkbox"
              aria-label="Seleccionar todas las órdenes"
            />
          </span>
        </th>
        <th scope="col">Orden</th>
        <th scope="col">Cliente</th>
        <th scope="col">Estado</th>
        <th scope="col" class="ds-table__cell--numeric">Total</th>
        <th scope="col"><span class="visually-hidden">Acciones</span></th>
      </tr>
    </thead>
    <tbody>
      <tr class="ds-table__row ds-table__row--selected">
        <td>
          <span class="ds-table__checkbox">
            <input
              class="ds-checkbox"
              type="checkbox"
              checked
              aria-label="Seleccionar orden ORD-1042"
            />
          </span>
        </td>
        <td>ORD-1042</td>
        <td>Ana Ruiz</td>
        <td>
          <span class="ds-badge ds-badge--success ds-badge--sm">Completado</span>
        </td>
        <td class="ds-table__cell--numeric">$1.240,00</td>
        <td class="ds-table__cell--actions">
          <button
            type="button"
            class="ds-button ds-button--ghost ds-button--sm"
            popovertarget="order-menu-1042"
            popovertargetaction="toggle"
            aria-label="Acciones de ORD-1042"
          >
            ⋯
          </button>
          <div id="order-menu-1042" class="ds-popover" popover data-rzz-popover-align="end">
            <div class="ds-menu" role="menu">
              <button type="button" class="ds-menu-item" role="menuitem">Ver detalle</button>
              <button type="button" class="ds-menu-item" role="menuitem">Descargar factura</button>
              <div class="ds-menu-separator" role="separator"></div>
              <button type="button" class="ds-menu-item ds-menu-item--danger" role="menuitem">
                Anular
              </button>
            </div>
          </div>
        </td>
      </tr>

      <tr class="ds-table__row">
        <td>
          <span class="ds-table__checkbox">
            <input
              class="ds-checkbox"
              type="checkbox"
              aria-label="Seleccionar orden ORD-1043"
            />
          </span>
        </td>
        <td>ORD-1043</td>
        <td>Luis Gómez</td>
        <td>
          <span class="ds-badge ds-badge--warning ds-badge--sm">Pendiente</span>
        </td>
        <td class="ds-table__cell--numeric">$380,50</td>
        <td class="ds-table__cell--actions">
          <button
            type="button"
            class="ds-button ds-button--ghost ds-button--sm"
            popovertarget="order-menu-1043"
            popovertargetaction="toggle"
            aria-label="Acciones de ORD-1043"
          >
            ⋯
          </button>
          <div id="order-menu-1043" class="ds-popover" popover data-rzz-popover-align="end">
            <div class="ds-menu" role="menu">
              <button type="button" class="ds-menu-item" role="menuitem">Ver detalle</button>
              <button type="button" class="ds-menu-item" role="menuitem">Marcar pagado</button>
              <div class="ds-menu-separator" role="separator"></div>
              <button type="button" class="ds-menu-item ds-menu-item--danger" role="menuitem">
                Anular
              </button>
            </div>
          </div>
        </td>
      </tr>

      <tr class="ds-table__row">
        <td>
          <span class="ds-table__checkbox">
            <input
              class="ds-checkbox"
              type="checkbox"
              aria-label="Seleccionar orden ORD-1044"
            />
          </span>
        </td>
        <td>ORD-1044</td>
        <td>María Sol</td>
        <td>
          <span class="ds-badge ds-badge--success ds-badge--sm">Completado</span>
        </td>
        <td class="ds-table__cell--numeric">$2.015,00</td>
        <td class="ds-table__cell--actions">
          <button
            type="button"
            class="ds-button ds-button--ghost ds-button--sm"
            popovertarget="order-menu-1044"
            popovertargetaction="toggle"
            aria-label="Acciones de ORD-1044"
          >
            ⋯
          </button>
          <div id="order-menu-1044" class="ds-popover" popover data-rzz-popover-align="end">
            <div class="ds-menu" role="menu">
              <button type="button" class="ds-menu-item" role="menuitem">Ver detalle</button>
              <button type="button" class="ds-menu-item" role="menuitem">Descargar factura</button>
              <div class="ds-menu-separator" role="separator"></div>
              <button type="button" class="ds-menu-item ds-menu-item--danger" role="menuitem">
                Anular
              </button>
            </div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<script type="module">
  import { bindPopoverMenus } from '../popover/popover.js';
  bindPopoverMenus();
</script>
