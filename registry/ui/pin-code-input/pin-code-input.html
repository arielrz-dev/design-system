<!--
  ds-pin — OTP 6 dígitos (SMS autofill + paste).
  Requiere: variables.css + pin-code-input.css/.js
  Sin maxlength: el navegador truncaría el código autocompletado antes de que
  el JS lo reparta entre las celdas; el JS limita cada celda a un dígito.
-->

<div class="ds-pin" role="group" aria-labelledby="otp-label">
  <span id="otp-label" class="ds-label">Código de verificación</span>
  <div class="ds-pin__cells">
    <input class="ds-pin__cell" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" aria-label="Dígito 1" />
    <input class="ds-pin__cell" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Dígito 2" />
    <input class="ds-pin__cell" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Dígito 3" />
    <input class="ds-pin__cell" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Dígito 4" />
    <input class="ds-pin__cell" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Dígito 5" />
    <input class="ds-pin__cell" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Dígito 6" />
  </div>
  <p class="ds-field__hint">Pegá el código completo o escribí dígito a dígito.</p>
</div>
