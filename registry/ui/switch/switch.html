<!--
  ds-switch — interruptor accesible.
  Requiere: ../styles/variables.css + switch.css
-->

<!-- Off -->
<label class="ds-switch" for="notifications">
  <span class="ds-switch__control">
    <input
      id="notifications"
      class="ds-switch__input"
      type="checkbox"
      role="switch"
      name="notifications"
      aria-checked="false"
    />
    <span class="ds-switch__track" aria-hidden="true">
      <span class="ds-switch__thumb"></span>
    </span>
  </span>
  <span>
    <span class="ds-switch__label">Notificaciones push</span>
    <span class="ds-switch__hint">Recibir alertas en este dispositivo</span>
  </span>
</label>

<!-- On -->
<label class="ds-switch" for="dark-pref">
  <span class="ds-switch__control">
    <input
      id="dark-pref"
      class="ds-switch__input"
      type="checkbox"
      role="switch"
      name="dark-pref"
      checked
      aria-checked="true"
    />
    <span class="ds-switch__track" aria-hidden="true">
      <span class="ds-switch__thumb"></span>
    </span>
  </span>
  <span class="ds-switch__label">Modo compacto</span>
</label>

<!-- Disabled -->
<label class="ds-switch" for="beta">
  <span class="ds-switch__control">
    <input
      id="beta"
      class="ds-switch__input"
      type="checkbox"
      role="switch"
      name="beta"
      disabled
      aria-disabled="true"
      aria-checked="false"
    />
    <span class="ds-switch__track" aria-hidden="true">
      <span class="ds-switch__thumb"></span>
    </span>
  </span>
  <span class="ds-switch__label">Funciones beta</span>
</label>

<script type="module">
  // Mantener aria-checked sincronizado con el estado nativo del checkbox.
  document.querySelectorAll('.ds-switch__input[role="switch"]').forEach((el) => {
    const sync = () => el.setAttribute('aria-checked', String(el.checked));
    el.addEventListener('change', sync);
    sync();
  });
</script>
