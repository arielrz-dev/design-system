<!--
  ds-setting-row — fila de ajustes (toda el área activa el control).
  Requiere: variables.css + switch.css (o checkbox.css) + setting-row.css
  Tip: no anides <label> dentro; el row YA es el label.
-->

<div class="ds-setting-list" role="list">
  <label class="ds-setting-row" role="listitem">
    <span class="ds-setting-row__left">
      <span class="ds-setting-row__icon" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none">
          <path
            d="M8 2.5v2M8 11.5v2M2.5 8h2M11.5 8h2M4.2 4.2l1.4 1.4M10.4 10.4l1.4 1.4M11.8 4.2l-1.4 1.4M5.6 10.4l-1.4 1.4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
          <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </span>
      <span class="ds-setting-row__meta">
        <span class="ds-setting-row__title">Modo Turbo</span>
        <span class="ds-setting-row__description">
          Acelera sincronización y reduce latencia percibida.
        </span>
      </span>
    </span>
    <span class="ds-setting-row__control">
      <span class="ds-switch__control">
        <input
          class="ds-switch__input"
          type="checkbox"
          role="switch"
          name="turbo-mode"
          aria-checked="false"
        />
        <span class="ds-switch__track" aria-hidden="true">
          <span class="ds-switch__thumb"></span>
        </span>
      </span>
    </span>
  </label>

  <label class="ds-setting-row" role="listitem">
    <span class="ds-setting-row__left">
      <span class="ds-setting-row__icon" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none">
          <path
            d="M8 13.25a1.25 1.25 0 001.25-1.25H6.75A1.25 1.25 0 008 13.25zM12.5 10.5V7.25a4.5 4.5 0 10-9 0V10.5l-1 1v.75h11v-.75l-1-1z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="ds-setting-row__meta">
        <span class="ds-setting-row__title">Notificaciones push</span>
        <span class="ds-setting-row__description">
          Alertas en tiempo real para menciones y despliegues.
        </span>
      </span>
    </span>
    <span class="ds-setting-row__control">
      <input class="ds-checkbox" type="checkbox" name="push-notifications" checked />
    </span>
  </label>
</div>
