<!--
  ds-stat-card — KPIs con tendencia y sparkline.
  Requiere: variables.css + stat-card.css
-->

<div class="ds-stat-grid">
  <article class="ds-stat-card">
    <div class="ds-stat-card__header">
      <h3 class="ds-stat-card__label">Ingresos MRR</h3>
      <span class="ds-stat-card__range">30 días</span>
    </div>
    <p class="ds-stat-card__value">$48.2k</p>
    <div class="ds-stat-card__footer">
      <span class="ds-stat-card__trend ds-stat-card__trend--up">+12.5%</span>
      <svg class="ds-stat-card__sparkline" viewBox="0 0 88 28" aria-hidden="true">
        <path d="M2 22 C12 20, 18 14, 28 16 S44 24, 54 12 S72 4, 86 8" />
      </svg>
    </div>
  </article>

  <article class="ds-stat-card">
    <div class="ds-stat-card__header">
      <h3 class="ds-stat-card__label">Churn</h3>
      <span class="ds-stat-card__range">30 días</span>
    </div>
    <p class="ds-stat-card__value">2.4%</p>
    <div class="ds-stat-card__footer">
      <span class="ds-stat-card__trend ds-stat-card__trend--down">-3.2%</span>
      <svg
        class="ds-stat-card__sparkline ds-stat-card__sparkline--down"
        viewBox="0 0 88 28"
        aria-hidden="true"
      >
        <path d="M2 8 C14 10, 22 18, 34 14 S52 6, 64 16 S78 24, 86 20" />
      </svg>
    </div>
  </article>
</div>
