<!--
  ds-alert — mensajes de feedback accesibles.
  Requiere: dist/css/variables.css + alert.css
-->

<div class="ds-alert ds-alert--info" role="alert" aria-labelledby="alert-info-title">
  <span class="ds-alert__icon" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.5" />
      <path d="M8 7v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="8" cy="5" r="0.75" fill="currentColor" />
    </svg>
  </span>
  <div class="ds-alert__content">
    <p id="alert-info-title" class="ds-alert__title">Actualización disponible</p>
    <p class="ds-alert__description">
      Hay una nueva versión del design system lista para instalar.
    </p>
  </div>
</div>

<div class="ds-alert ds-alert--success" role="status" aria-labelledby="alert-ok-title">
  <span class="ds-alert__icon" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.5" />
      <path d="M5 8.2l2 2 4-4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </span>
  <div class="ds-alert__content">
    <p id="alert-ok-title" class="ds-alert__title">Cambios guardados</p>
    <p class="ds-alert__description">Tu perfil se actualizó correctamente.</p>
  </div>
</div>

<div class="ds-alert ds-alert--warning" role="alert" aria-labelledby="alert-warn-title">
  <span class="ds-alert__icon" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="none">
      <path d="M8 2.5L14 13.5H2L8 2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M8 7v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="8" cy="11.25" r="0.75" fill="currentColor" />
    </svg>
  </span>
  <div class="ds-alert__content">
    <p id="alert-warn-title" class="ds-alert__title">Cuota casi agotada</p>
    <p class="ds-alert__description">Usaste el 90% del plan mensual.</p>
  </div>
</div>

<div class="ds-alert ds-alert--danger" role="alert" aria-labelledby="alert-err-title">
  <span class="ds-alert__icon" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.5" />
      <path d="M8 5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="8" cy="11" r="0.75" fill="currentColor" />
    </svg>
  </span>
  <div class="ds-alert__content">
    <p id="alert-err-title" class="ds-alert__title">No se pudo eliminar</p>
    <p class="ds-alert__description">Revisá los permisos e intentá de nuevo.</p>
  </div>
</div>
