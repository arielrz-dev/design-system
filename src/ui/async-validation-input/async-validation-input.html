<!--
  ds-async — validación con debounce (demo username).
  Requiere: variables.css + async-validation-input.css/.js
  Probar: "admin" o "taken" → error; "ariel" → success.
-->

<div class="ds-async" data-state="idle">
  <label class="ds-label" for="username-async">Nombre de usuario</label>
  <div class="ds-async__control">
    <input
      id="username-async"
      class="ds-async__input"
      type="text"
      name="username"
      autocomplete="username"
      spellcheck="false"
      placeholder="ej. ariel"
      aria-describedby="username-async-msg"
    />
    <span class="ds-async__status" aria-hidden="true">
      <svg class="ds-async__icon ds-async__icon--spinner" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" opacity="0.25" />
        <path d="M14 8a6 6 0 00-6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <svg class="ds-async__icon ds-async__icon--success" viewBox="0 0 16 16" fill="none">
        <path d="M3.5 8.5l3 3 6-6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <svg class="ds-async__icon ds-async__icon--error" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" />
        <path d="M8 5v3.5M8 11h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </span>
  </div>
  <p id="username-async-msg" class="ds-async__message" aria-live="polite">
    <span class="ds-async__message-text"></span>
  </p>
</div>
