<!--
  ds-dialog — modal nativo de confirmación.
  Requiere: dist/css/variables.css + dialog.css + button.css + dialog.js
-->

<button
  type="button"
  class="ds-button ds-button--danger ds-button--md"
  data-ds-dialog-open="confirm-delete"
>
  Eliminar proyecto
</button>

<dialog
  id="confirm-delete"
  class="ds-dialog"
  aria-labelledby="confirm-delete-title"
  aria-describedby="confirm-delete-desc"
>
  <header class="ds-dialog__header">
    <button
      type="button"
      class="ds-button ds-button--ghost ds-button--sm ds-dialog__close"
      data-ds-dialog-close
      aria-label="Cerrar diálogo"
    >
      ✕
    </button>
    <h2 id="confirm-delete-title" class="ds-dialog__title">
      ¿Eliminar este proyecto?
    </h2>
    <p id="confirm-delete-desc" class="ds-dialog__description">
      Esta acción no se puede deshacer. El proyecto y sus datos asociados
      se borrarán de forma permanente.
    </p>
  </header>

  <div class="ds-dialog__body">
    <p>
      Escribí el nombre del proyecto para confirmar, o cancelá para volver
      sin cambios.
    </p>
  </div>

  <footer class="ds-dialog__footer">
    <button
      type="button"
      class="ds-button ds-button--secondary ds-button--md"
      data-ds-dialog-close
    >
      Cancelar
    </button>
    <button
      type="button"
      class="ds-button ds-button--danger ds-button--md"
      data-ds-dialog-confirm
    >
      Eliminar
    </button>
  </footer>
</dialog>

<script type="module" src="./dialog.js"></script>
