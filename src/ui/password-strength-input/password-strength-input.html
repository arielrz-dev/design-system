<!--
  ds-password — contraseña + medidor accesible.
  Requiere: variables.css + password-strength-input.css/.js
-->

<div class="ds-password">
  <label class="ds-label" for="new-password">Contraseña</label>
  <div class="ds-password__control">
    <input
      id="new-password"
      class="ds-password__input"
      type="password"
      name="password"
      autocomplete="new-password"
      aria-describedby="password-strength-status"
    />
    <button
      type="button"
      class="ds-password__toggle"
      aria-label="Mostrar contraseña"
      aria-pressed="false"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path
          d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5" />
      </svg>
    </button>
  </div>
  <div
    class="ds-password__meter"
    role="meter"
    aria-label="Fuerza de contraseña"
    aria-valuemin="0"
    aria-valuemax="4"
    aria-valuenow="0"
    aria-valuetext="Vacía"
    data-strength="0"
  >
    <span class="ds-password__segment" aria-hidden="true"></span>
    <span class="ds-password__segment" aria-hidden="true"></span>
    <span class="ds-password__segment" aria-hidden="true"></span>
    <span class="ds-password__segment" aria-hidden="true"></span>
  </div>
  <p
    id="password-strength-status"
    class="ds-password__status"
    data-strength="0"
    aria-live="polite"
  >
    Ingresá una contraseña
  </p>
</div>
