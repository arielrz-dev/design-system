<!--
  ds-radio-card — selector de densidad / planes.
  Requiere: ../styles/variables.css + radio-card.css
-->

<div class="ds-radio-grid" role="radiogroup" aria-label="Densidad de interfaz">
  <label class="ds-radio-card">
    <input
      class="ds-radio-card__input"
      type="radio"
      name="density-option"
      value="comfortable"
      checked
    />
    <span class="ds-radio-card__header">
      <span class="ds-radio-card__title">Cómoda</span>
      <span class="ds-radio-card__indicator" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none">
          <path
            d="M3.5 8.5l3 3 6-6.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </span>
    <span class="ds-radio-card__description">
      Más aire entre bloques. Ideal para lectura y onboarding.
    </span>
    <span class="ds-radio-card__value">Spacing 1.0×</span>
  </label>

  <label class="ds-radio-card">
    <input
      class="ds-radio-card__input"
      type="radio"
      name="density-option"
      value="compact"
    />
    <span class="ds-radio-card__header">
      <span class="ds-radio-card__title">Compacta</span>
      <span class="ds-radio-card__badge">Popular</span>
      <span class="ds-radio-card__indicator" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none">
          <path
            d="M3.5 8.5l3 3 6-6.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </span>
    <span class="ds-radio-card__description">
      Densidad equilibrada para dashboards y listas densas.
    </span>
    <span class="ds-radio-card__value">Spacing 0.85×</span>
  </label>

  <label class="ds-radio-card">
    <input
      class="ds-radio-card__input"
      type="radio"
      name="density-option"
      value="ultra"
    />
    <span class="ds-radio-card__header">
      <span class="ds-radio-card__title">Ultra</span>
      <span class="ds-radio-card__indicator" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none">
          <path
            d="M3.5 8.5l3 3 6-6.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </span>
    <span class="ds-radio-card__description">
      Máxima densidad. Pensado para power users y tablas.
    </span>
    <span class="ds-radio-card__value">Spacing 0.7×</span>
  </label>
</div>
