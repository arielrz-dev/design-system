<!--
  ds-tabs — pestañas accesibles (WAI-ARIA).
  Requiere: ../styles/variables.css + tabs.css + tabs.js
-->

<div class="ds-tabs" data-ds-tabs id="account-tabs">
  <div class="ds-tabs__list" role="tablist" aria-label="Secciones de cuenta">
    <button
      type="button"
      class="ds-tabs__trigger"
      role="tab"
      id="tab-profile"
      aria-controls="panel-profile"
      aria-selected="true"
      tabindex="0"
    >
      Perfil
    </button>
    <button
      type="button"
      class="ds-tabs__trigger"
      role="tab"
      id="tab-security"
      aria-controls="panel-security"
      aria-selected="false"
      tabindex="-1"
    >
      Seguridad
    </button>
    <button
      type="button"
      class="ds-tabs__trigger"
      role="tab"
      id="tab-billing"
      aria-controls="panel-billing"
      aria-selected="false"
      tabindex="-1"
    >
      Facturación
    </button>
  </div>

  <div
    class="ds-tabs__content"
    role="tabpanel"
    id="panel-profile"
    aria-labelledby="tab-profile"
    tabindex="0"
  >
    <p>Actualizá tu nombre visible y la foto de perfil del workspace.</p>
  </div>

  <div
    class="ds-tabs__content"
    role="tabpanel"
    id="panel-security"
    aria-labelledby="tab-security"
    tabindex="0"
    hidden
  >
    <p>Gestioná contraseña, 2FA y sesiones activas.</p>
  </div>

  <div
    class="ds-tabs__content"
    role="tabpanel"
    id="panel-billing"
    aria-labelledby="tab-billing"
    tabindex="0"
    hidden
  >
    <p>Revisá el plan actual, método de pago y facturas.</p>
  </div>
</div>

<script type="module" src="./tabs.js"></script>
