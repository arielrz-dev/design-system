<!--
  ds-textarea — formulario con label y hint/error.
  Requiere: dist/css/variables.css + input.css (field/label) + textarea.css
-->

<div class="ds-field">
  <label class="ds-label" for="bio">Biografía</label>
  <textarea
    id="bio"
    class="ds-textarea"
    name="bio"
    rows="4"
    placeholder="Contá un poco sobre vos…"
    aria-describedby="bio-hint"
  ></textarea>
  <p id="bio-hint" class="ds-field__hint">Máximo 280 caracteres.</p>
</div>

<div class="ds-field">
  <label class="ds-label" for="notes-error">Notas internas</label>
  <textarea
    id="notes-error"
    class="ds-textarea ds-textarea--error"
    name="notes"
    rows="3"
    aria-invalid="true"
    aria-describedby="notes-error-msg"
  >Texto demasiado corto</textarea>
  <p id="notes-error-msg" class="ds-field__error" role="alert">
    Completá al menos 20 caracteres.
  </p>
</div>

<div class="ds-field">
  <label class="ds-label" for="notes-disabled">Comentario (disabled)</label>
  <textarea
    id="notes-disabled"
    class="ds-textarea"
    name="comment"
    rows="3"
    disabled
    aria-disabled="true"
  >Solo lectura</textarea>
</div>
